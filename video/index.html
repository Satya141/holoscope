<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* holoscope: layer order */
      #root > video { z-index: 1; }
      .scene { z-index: 2; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-take-it-apart"
        class="scene"
        data-composition-id="01-take-it-apart"
        data-composition-src="compositions/frames/01-take-it-apart.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-holoscope"
        class="scene"
        data-composition-id="02-holoscope"
        data-composition-src="compositions/frames/02-holoscope.html"
        data-start="4.5"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-open-your-hand"
        class="scene"
        data-composition-id="03-open-your-hand"
        data-composition-src="compositions/frames/03-open-your-hand.html"
        data-start="7"
        data-duration="2.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-point"
        class="scene"
        data-composition-id="04-point"
        data-composition-src="compositions/frames/04-point.html"
        data-start="9.5"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-pinch"
        class="scene"
        data-composition-id="05-pinch"
        data-composition-src="compositions/frames/05-pinch.html"
        data-start="12"
        data-duration="2.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-engines-to-dna"
        class="scene"
        data-composition-id="06-engines-to-dna"
        data-composition-src="compositions/frames/06-engines-to-dna.html"
        data-start="14.5"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-07-brand"
        class="scene"
        data-composition-id="07-brand"
        data-composition-src="compositions/frames/07-brand.html"
        data-start="17"
        data-duration="3"
        data-track-index="0"
      ></div>

      <video id="f01-video" src="assets/earth-reveal.mp4" preload="auto" data-media-start="0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover"
        data-start="0"
        data-duration="4.5"
        data-track-index="1000"
      ></video>

      <video id="f02-video" src="assets/earth-reveal.mp4" preload="auto" data-media-start="4.5" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover"
        data-start="4.5"
        data-duration="2.5"
        data-track-index="2000"
      ></video>

      <video id="f03-video" src="assets/car-open.mp4" preload="auto" data-media-start="0.3" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover"
        data-start="7"
        data-duration="2.5"
        data-track-index="3000"
      ></video>

      <video id="f04-video" src="assets/brain-point.mp4" preload="auto" data-media-start="0.4" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover"
        data-start="9.5"
        data-duration="2.5"
        data-track-index="4000"
      ></video>

      <video id="f05-video" src="assets/jet-pinch.mp4" preload="auto" data-media-start="0.3" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover"
        data-start="12"
        data-duration="2.5"
        data-track-index="5000"
      ></video>

      <video id="f06-video-a" src="assets/jet-reveal.mp4" preload="auto" data-media-start="3.4" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover"
        data-start="14.5"
        data-duration="0.85"
        data-track-index="6000"
      ></video>

      <video id="f06-video-b" src="assets/dna-unzip.mp4" preload="auto" data-media-start="0.5" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover"
        data-start="15.35"
        data-duration="0.85"
        data-track-index="6001"
      ></video>

      <video id="f06-video-c" src="assets/car-spin.mp4" preload="auto" data-media-start="0.2" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover"
        data-start="16.2"
        data-duration="1.3"
        data-track-index="6002"
      ></video>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/whoosh.mp3"
        data-start="0"
        data-duration="3.155"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/impact.mp3"
        data-start="0"
        data-duration="2.623"
        data-track-index="21"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/whoosh.mp3"
        data-start="7"
        data-duration="3.155"
        data-track-index="22"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-3"
        src="assets/sfx/click.mp3"
        data-start="9.5"
        data-duration="2.31"
        data-track-index="23"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-4"
        src="assets/sfx/pop.mp3"
        data-start="12"
        data-duration="0.489"
        data-track-index="24"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-5"
        src="assets/sfx/whoosh.mp3"
        data-start="14.5"
        data-duration="3.155"
        data-track-index="25"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-6"
        src="assets/sfx/riser.mp3"
        data-start="17"
        data-duration="2"
        data-track-index="26"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-06-engines-to-dna", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.fromTo("#el-07-brand", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
